{% extends 'base.html' %}
{% block title %}Вход — AutoDrive{% endblock %}

{% block content %}
    <div class="form-card" style="max-width: 400px; margin: 40px auto; background: #fff; padding: 30px; border-radius: 12px; box-shadow: var(--shadow);">
        <h2 style="text-align: center; margin-bottom: 30px;">Вход в систему</h2>
        <form method="post">
            {% csrf_token %}
            {% if form.errors %}
                <p style="color: var(--danger); margin-bottom: 15px; text-align: center;">Неверный логин или пароль.</p>
            {% endif %}
            <div class="form-group">
                <label>Имя пользователя</label>
                <input type="text" name="username" class="form-control" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;">
            </div>
            <div class="form-group">
                <label>Пароль</label>
                <input type="password" name="password" class="form-control" required style="width: 100%; padding: 10px; border: 1px solid var(--border); border-radius: 8px;">
            </div>
            <button type="submit" class="btn-primary" style="width: 100%; margin-top: 10px;">Войти</button>
        </form>
    </div>
{% endblock %}
