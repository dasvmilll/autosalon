{% extends 'base.html' %}
{% block title %}Новая заявка на трейд-ин — AutoDrive{% endblock %}

{% block content %}
    <div class="form-card">
        <h2>Заявка на оценку автомобиля</h2>
        <form method="post" enctype="multipart/form-data" novalidate id="tradeinForm">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label>{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}
                        <div class="errorlist">{{ field.errors }}</div>
                    {% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn-primary btn-full">Отправить заявку</button>
        </form>
    </div>
{% endblock %}
