{% extends 'base.html' %}
{% block title %}Мои брони — AutoDrive{% endblock %}

{% block content %}
    <h1>Мои брони</h1>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr><th>Автомобиль</th><th>VIN</th><th>Статус</th></tr>
            </thead>
            <tbody>
                {% for r in reservations %}
                    <tr>
                        <td>{{ r.car.trim.car_model }}</td>
                        <td>{{ r.car.vin }}</td>
                        <td>{{ r.get_status_display }}</td>
                    </tr>
                {% empty %}
                    <tr><td colspan="3">Броней нет.</td></tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
