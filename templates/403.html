{% extends 'base.html' %}

{% block title %}403 — Доступ запрещён — AutoDrive{% endblock %}

{% block content %}
<div class="error-page">
    <div>
        <div class="error-icon"></div>
        <div class="error-code code-403">403</div>
        <h2 class="error-title">Доступ запрещён</h2>
        <p class="error-message">
            У вас нет прав для просмотра этой страницы.
            Возможно, вам нужно войти в систему под другой учётной записью.
        </p>
        <div class="d-flex justify-content-center gap-3 flex-wrap">
            <a href="/" class="btn btn-warning btn-error">
                 На главную
            </a>
            <a href="/accounts/login/" class="btn btn-outline-warning btn-error">
                 Войти
            </a>
        </div>
    </div>
</div>
{% endblock %}
